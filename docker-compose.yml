services:

  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    volumes:
      - db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: <DB-PW>
      POSTGRES_DB: eviction
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 60s
      retries: 5
      start_period: 30s
      timeout: 10s

  ui:
    restart: always
    image: ghcr.io/osu-justicetech/case_collector:main
    command: ["sh","-c","uv run manage.py collectstatic --noinput && uv run manage.py createcachetable && uv run manage.py migrate && uv run uvicorn eviction_tool.asgi:application --host 0.0.0.0"]
    env_file: "django_env"
    #environment:
      #DJANGO_DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "echo \"import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')\" | uv run -"]
      interval: 30s
      start_period: 30s
      timeout: 10s
      retries: 3
  
  scraper_public:
    image: ghcr.io/osu-justicetech/case_collector:main
    command: ["sh","-c","uv run manage.py fcmcclerk"]
    restart: always
    env_file: "django_env"
    
    depends_on:
      ui:
        condition: service_healthy
        restart: true
 
  scraper_nextgen:
    image: ghcr.io/osu-justicetech/case_collector:main
    command: ["sh","-c","uv run manage.py nextgen"]
    restart: always
    env_file: "django_env"
    environment:
      NEXTGEN_PASSWORD: "nextgen-password" 
      NEXTGEN_EMAIL: "nextgen-email@example.com"
    volumes:
      - pdfs:/scrape-storage
    depends_on:
      ui:
        condition: service_healthy
        restart: true


  metabase:
    image: metabase/metabase:latest
    restart: always
    volumes:
      - /dev/urandom:/dev/random:ro
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: "/metabase-data/metabase.db"
    ports:
      - 3000:3000

volumes:
  db:
  metabase-data:
  pdfs:
